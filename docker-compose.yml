services:
  ldap-server:
    image: osixia/openldap:1.5.0
    container_name: linux_ldap_server
    environment:
      - LDAP_ORGANISATION=Ulagos
      - LDAP_DOMAIN=login-ldap.ra3.localhost
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_BASE_DN=dc=login-ldap,dc=ra3,dc=localhost
      - LDAP_TLS=false          # Desactivar TLS para simplificar
    volumes:
      - ./ldap-bootstrap/usuarios.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-usuarios.ldif
    ports:
      - "389:389"
    networks:
      - ldap-net
    command: --copy-service     # ← CLAVE: Copia archivos en lugar de moverlos
    restart: always

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=ldap-server
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8080:80"
    depends_on:
      - ldap-server
    networks:
      - ldap-net
    restart: always

  web-app:
    build: .
    container_name: app-flask_login-ldap
    ports:
      - "5050:5000"
    environment:
      - LDAP_HOST=ldap-server
      - LDAP_BASE_DN=dc=login-ldap,dc=ra3,dc=localhost
    depends_on:
      - ldap-server
    networks:
      - ldap-net
    restart: always

networks:
  ldap-net:
    driver: bridge