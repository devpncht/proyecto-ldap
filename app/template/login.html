<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login LDAP</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 340px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .resultado {
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        .true {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .false {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Inicio de Sesión</h2>
        <form method="POST">
            <div class="group">
                <label>Usuario:</label>
                <input type="text" name="username" required placeholder="Ej: devpncht">
            </div>
            <div class="group">
                <label>Contraseña:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>

        {% if mensaje %}
        <div class="resultado {% if caso_true_false %}true{% else %}false{% endif %}">
            {{ mensaje }}
        </div>
        {% endif %}
    </div>

</body>

</html>
